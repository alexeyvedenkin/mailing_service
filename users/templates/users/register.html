{% extends 'mailwork/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-5">
            <form class="row" method="post" enctype="multipart/form-data">
                 <div class="card">
                     <div class="card-body">
                         {% csrf_token %}
                         {% if form.errors %}
                             <div class="alert alert-danger">
                                 {{ form.errors }}
                             </div>
                         {% endif %}
                         {{ form.as_p }}
                         <button type="submit" class="btn btn-primary">
                             {% if not object %}
                             Регистрация
                             {% else %}
                             Сохранить
                             {% endif %}
                         </button>
                         <a class="p-2 btn btn-outline-primary" href="/message_list/">Отмена</a>
                     </div>
                 </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
