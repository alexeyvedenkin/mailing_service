{% extends 'mailwork/base.html' %}
{% load my_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Список адресатов</h1>
</div>
<div class="container">
    <!-- Добавляем таблицу для вывода адресатов -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Имя</th>
                <th>Email</th>
                <th>Комментарий</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for recipient in recipients %}
            <tr>
                <td>{{ recipient.fullname }}</td> <!-- Выводим имя адресата -->
                <td>{{ recipient.email }}</td> <!-- Выводим Email адресата -->
                <td>{{ recipient.comment }}</td> <!-- Выводим комментарий адресата -->
                <td>
                    <a type="button" class="btn btn-outline-danger"
                       href="{% url 'mailwork:recipient_delete' recipient.pk %}">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
