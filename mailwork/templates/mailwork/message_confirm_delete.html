{% extends 'mailwork/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-5">
            <form class="row" method="post" enctype="multipart/form-data">
                 <div class="card">
                     <p class="card-text">Вы действительно хотите удалить {{ object.name }} ?</p>
                     <div class="card-body">
                         {% csrf_token %}
                         <button type="submit" class="btn btn-danger">Удалить</button>
                         <a href="{% url 'mailwork:user_owned_messages' %}" class="btn btn-primary">Отмена</a>
                     </div>
                 </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
